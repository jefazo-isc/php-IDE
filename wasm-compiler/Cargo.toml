[package]
name = "ide-indomito-compiler"
version = "0.1.0"
edition = "2021"
description = "WebAssembly compiler for IDE Indómito"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
regex = "1.10"
lazy_static = "1.4"
